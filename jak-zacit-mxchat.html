<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8">
  <title>Chat, který nemá jednoho majitele</title>
  <style>
    @font-face {
      font-family: 'JBM';
      src: local('JetBrainsMono Nerd Font'), local('JetBrains Mono');
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #181825;
      font-family: 'JBM', 'JetBrains Mono', 'DejaVu Sans Mono', 'Fira Code', monospace;
    }

    .cover {
      width: 1200px;
      height: 630px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 56px;
      box-sizing: border-box;
      color: #cdd6f4;
      background:
        radial-gradient(circle at 18% 12%, rgba(137, 180, 250, 0.10), transparent 40%),
        radial-gradient(circle at 84% 86%, rgba(203, 166, 247, 0.10), transparent 42%),
        #1e1e2e;
      overflow: hidden;
    }

    /* faint dot grid texture */
    .cover::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(205, 214, 244, 0.05) 1px, transparent 1px);
      background-size: 26px 26px;
      pointer-events: none;
    }

    .header {
      position: absolute;
      top: 44px;
      left: 56px;
      font-size: 22px;
      color: #89b4fa;
      font-weight: bold;
      letter-spacing: 0.3px;
    }

    .stage {
      display: flex;
      align-items: center;
      gap: 78px;
      margin-bottom: 34px;
    }

    /* ---- Node / bubble stack ---- */
    .stack {
      position: relative;
      width: 300px;
      height: 300px;
      flex: 0 0 auto;
    }

    /* federation link lines, drawn behind everything */
    .stack svg.links {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .tile {
      position: absolute;
      width: 176px;
      height: 130px;
      border-radius: 16px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 12px 14px;
    }

    .tile .line {
      height: 8px;
      border-radius: 4px;
      background: rgba(17, 17, 27, 0.30);
      margin-bottom: 6px;
    }

    .tile .line.short {
      width: 55%;
    }

    .tile.a {
      top: 4px;
      left: -6px;
      transform: rotate(-8deg);
      background: linear-gradient(155deg, #89b4fa 0%, #6c93d6 55%, #4d6fa8 100%);
      z-index: 1;
    }

    .tile.b {
      top: 150px;
      left: 6px;
      transform: rotate(6deg);
      background: linear-gradient(155deg, #94e2d5 0%, #67b3a6 55%, #438177 100%);
      z-index: 1;
    }

    .tile.c {
      top: 100px;
      left: 132px;
      transform: rotate(-4deg);
      background: linear-gradient(155deg, #cba6f7 0%, #a780cf 55%, #7a5ba3 100%);
      z-index: 1;
    }

    .lock {
      position: absolute;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%);
      width: 108px;
      height: 108px;
      border-radius: 50%;
      background: #11111b;
      border: 2px solid #45475a;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 10px #1e1e2e, 0 22px 50px rgba(0, 0, 0, 0.55), 0 0 34px rgba(137, 180, 250, 0.28);
      z-index: 4;
    }

    .lock svg {
      width: 46px;
      height: 46px;
    }

    .badge {
      position: absolute;
      left: 50%;
      bottom: -18px;
      transform: translateX(-50%);
      background: #89b4fa;
      color: #11111b;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.5px;
      padding: 5px 12px;
      border-radius: 999px;
      z-index: 5;
      white-space: nowrap;
    }

    /* ---- Terminal card ---- */
    .terminal {
      background: #11111b;
      border: 2px solid #45475a;
      border-radius: 12px;
      padding: 26px 30px;
      width: 470px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      font-size: 18px;
      line-height: 1.85;
    }

    .prompt {
      color: #89b4fa;
    }

    .cmd {
      color: #cdd6f4;
    }

    .path {
      color: #f9e2af;
    }

    .ok {
      color: #a6e3a1;
    }

    .no {
      color: #6c7086;
    }

    .comment {
      color: #6c7086;
    }

    .title {
      font-size: 50px;
      font-weight: bold;
      color: #f5e0dc;
      text-align: center;
      line-height: 1.18;
      max-width: 900px;
    }

    .subtitle {
      margin-top: 14px;
      font-size: 23px;
      color: #a6adc8;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .subtitle .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #89b4fa;
    }
  </style>
</head>

<body>
  <div class="cover">
    <div class="header">☁ OSCloud • chat</div>

    <div class="stage">
      <div class="stack">
        <svg class="links" viewBox="0 0 300 300">
          <line x1="150" y1="150" x2="70" y2="65" stroke="#45475a" stroke-width="2" stroke-dasharray="4 5" />
          <line x1="150" y1="150" x2="90" y2="210" stroke="#45475a" stroke-width="2" stroke-dasharray="4 5" />
          <line x1="150" y1="150" x2="215" y2="165" stroke="#45475a" stroke-width="2" stroke-dasharray="4 5" />
        </svg>

        <div class="tile a">
          <div class="line short"></div>
          <div class="line"></div>
        </div>
        <div class="tile b">
          <div class="line short"></div>
          <div class="line"></div>
        </div>
        <div class="tile c">
          <div class="line short"></div>
          <div class="line"></div>
        </div>

        <div class="lock">
          <svg viewBox="0 0 24 24" fill="none" stroke="#89b4fa" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path
              d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z">
            </path>
          </svg>
        </div>
        <div class="badge">federovaný protokol</div>
      </div>

      <div class="terminal">
        <div><span class="prompt">➜</span> <span class="cmd">připojit</span> <span class="path">@ja:mxchat.cz</span>
        </div>
        <div><span class="ok">✓</span> federace &nbsp;<span class="comment"># i s matrix.org</span></div>
        <div><span class="ok">✓</span> E2E šifrování &nbsp;<span class="comment"># Olm/Megolm</span></div>
        <div><span class="no">žádný centrální server</span></div>
        <div>&nbsp;&nbsp;<span class="comment">žádný jeden pán nad daty</span></div>
      </div>
    </div>

    <div class="title">Chat, který nemá<br>jednoho majitele</div>
    <div class="subtitle"><span class="dot"></span>blog.oscloud.cz</div>
  </div>
</body>

</html>
